services:
  db:
    image: mysql:8.0
    container_name: financiera_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bd_ludi_financiera
    ports:
      # Cambiado a 3307 para evitar conflicto con XAMPP (que usa 3306)
      - "3307:3306"
    volumes:
      # Montar el script SQL para que MySQL lo ejecute al iniciar por primera vez
      - ./schema_y_datos.sql:/docker-entrypoint-initdb.d/init.sql
      # Volumen para persistir los datos
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: financiera_phpmyadmin
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      # Visualizador disponible en http://localhost:8081
      - "8081:80"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financiera_backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Apuntar a la base de datos en el contenedor 'db'
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/bd_ludi_financiera?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: financiera_frontend
    depends_on:
      - backend
    ports:
      # Mapear el puerto 5173 (Host) al puerto 80 (Contenedor Nginx)
      - "5173:80"

volumes:
  db_data:
