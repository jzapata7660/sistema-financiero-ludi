services:
  db:
    image: mysql:8.0
    container_name: financiera_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-bd_ludi_financiera}
    ports:
      # Cambiado a 3307 por defecto para evitar conflicto con XAMPP (que usa 3306)
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      # Montar el script SQL para que MySQL lo ejecute al iniciar por primera vez
      - ./schema_y_datos.sql:/docker-entrypoint-initdb.d/init.sql
      # Volumen para persistir los datos
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: financiera_phpmyadmin
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-root}
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      # Visualizador configurable (por defecto en http://localhost:8081)
      - "${PHPMYADMIN_PORT:-8081}:80"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financiera_backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      # Apuntar a la base de datos en el contenedor 'db'
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/${DB_NAME:-bd_ludi_financiera}?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-root}
      - SPRING_DATASOURCE_PASSWORD=${DB_ROOT_PASSWORD:-root}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8080/api}
    container_name: financiera_frontend
    depends_on:
      - backend
    ports:
      # Mapear el puerto Host al puerto 80 (Contenedor Nginx)
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  db_data:
